<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mate & Co. — Ventas y Reservas</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#233E30">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Splash -->
<div id="splash">
  <div class="neon-frame"><img src="icons/icon-512.png" alt="Logo" class="splash-logo"></div>
  <div class="brand splash-brand">Mate & Co.</div>
  <div class="tagline">Ventas · Reservas</div>
</div>

<header class="top">
  <div class="row">
    <div class="brand-wrap" id="brand-wrap">
      <img src="icons/icon-192.png" alt="Logo">
      <div>
        <div class="brand">Mate & Co.</div>
        <div class="sub">Catálogo de ventas</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="btn-cart">🛒<span id="cart-badge" class="cart-badge" style="display:none">0</span></button>
      <div class="menu-wrap">
        <button class="icon-btn" id="btn-ajustes" style="width:100%">⚙ Ajustes</button>
        <div class="dropdown-menu" id="dropdown-menu">
          <button class="dropdown-item" id="menu-profile">👤 Perfil</button>
          <button class="dropdown-item" id="menu-theme">🎨 Temas</button>
          <button class="dropdown-item" id="menu-admin" style="display:none">⚙ Panel</button>
        </div>
      </div>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<div class="view-switch" id="view-switch">
  <button class="view-btn" data-view="grid" title="Cuadrícula">▦</button>
  <button class="view-btn" data-view="list" title="Lista">☰</button>
  <button class="view-btn" data-view="details" title="Detalle">▤</button>
</div>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <div class="social-row">
    <a href="#" id="footer-wa" class="social-icon" title="WhatsApp" aria-label="WhatsApp">
      <svg viewBox="0 0 32 32" width="20" height="20" fill="currentColor"><path d="M16 3C9.1 3 3.5 8.6 3.5 15.5c0 2.4.7 4.7 1.9 6.7L3 29l7-2.3c1.9 1.1 4.1 1.7 6 1.7 6.9 0 12.5-5.6 12.5-12.5S22.9 3 16 3zm0 22.7c-1.9 0-3.7-.5-5.3-1.5l-.4-.2-4.2 1.4 1.4-4.1-.2-.4c-1.1-1.7-1.7-3.7-1.7-5.8 0-5.7 4.6-10.3 10.3-10.3s10.3 4.6 10.3 10.3S21.7 25.7 16 25.7zm5.6-7.7c-.3-.2-1.8-.9-2.1-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-1 1.2-.2.2-.4.2-.7.1-.3-.2-1.4-.5-2.6-1.6-1-.9-1.6-2-1.8-2.3-.2-.3 0-.5.1-.6.1-.1.3-.4.4-.5.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5C13.5 12.7 13 11.5 12.7 11c-.3-.5-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4s1 2.8 1.2 3c.1.2 2.1 3.2 5 4.5.7.3 1.2.5 1.7.6.7.2 1.3.2 1.8.1.5-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.1-.3-.2-.6-.4z"/></svg>
    </a>
    <a href="https://instagram.com/laaseluu" id="footer-ig" class="social-icon" target="_blank" rel="noopener" title="Instagram @laaseluu" aria-label="Instagram">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="2.5" width="19" height="19" rx="5"/><circle cx="12" cy="12" r="4.3"/><circle cx="17.3" cy="6.7" r="1.1" fill="currentColor" stroke="none"/></svg>
    </a>
    <span class="social-handle">@laaseluu</span>
  </div>
  Desarrollado por <b>Nahualejandro</b>
</footer>

<!-- Modal producto -->
<div class="overlay" id="overlay-product">
  <div class="sheet" id="sheet-product"></div>
</div>

<!-- Modal admin -->
<div class="overlay" id="overlay-admin">
  <div class="sheet" id="sheet-admin"></div>
</div>

<!-- Modal carrito -->
<div class="overlay" id="overlay-cart">
  <div class="sheet" id="sheet-cart"></div>
</div>

<!-- Modal temas -->
<div class="overlay" id="overlay-theme">
  <div class="sheet" id="sheet-theme"></div>
</div>

<!-- Modal perfil -->
<div class="overlay" id="overlay-profile">
  <div class="sheet" id="sheet-profile"></div>
</div>

<div class="toast" id="toast"></div>

<!-- WhatsApp flotante: consulta directa a la dueña -->
<a href="#" id="btn-wa-float" class="wa-float" title="Escribir por WhatsApp" aria-label="Escribir por WhatsApp">
  <span class="wa-float-pulse"></span>
  <span class="wa-float-pulse wa-float-pulse2"></span>
  <svg class="wa-float-icon" viewBox="0 0 32 32" width="28" height="28" fill="#ffffff"><path d="M16 3C9.1 3 3.5 8.6 3.5 15.5c0 2.4.7 4.7 1.9 6.7L3 29l7-2.3c1.9 1.1 4.1 1.7 6 1.7 6.9 0 12.5-5.6 12.5-12.5S22.9 3 16 3zm0 22.7c-1.9 0-3.7-.5-5.3-1.5l-.4-.2-4.2 1.4 1.4-4.1-.2-.4c-1.1-1.7-1.7-3.7-1.7-5.8 0-5.7 4.6-10.3 10.3-10.3s10.3 4.6 10.3 10.3S21.7 25.7 16 25.7zm5.6-7.7c-.3-.2-1.8-.9-2.1-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-1 1.2-.2.2-.4.2-.7.1-.3-.2-1.4-.5-2.6-1.6-1-.9-1.6-2-1.8-2.3-.2-.3 0-.5.1-.6.1-.1.3-.4.4-.5.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5C13.5 12.7 13 11.5 12.7 11c-.3-.5-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4s1 2.8 1.2 3c.1.2 2.1 3.2 5 4.5.7.3 1.2.5 1.7.6.7.2 1.3.2 1.8.1.5-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.1-.3-.2-.6-.4z"/></svg>
</a>

<script src="data.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
